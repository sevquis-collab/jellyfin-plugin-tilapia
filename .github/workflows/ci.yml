name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Tilapia.sln
      - name: Build
        run: dotnet build Tilapia.sln -c Release --no-restore -warnaserror
      - name: Test
        run: dotnet test Tilapia.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Check manager JavaScript
        run: node --check Jellyfin.Plugin.Podcasts/Manager/manager.js
